<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio.exe | 90s Retro-Tech</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: VT323 (pixel/terminal font) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  
  <!-- Custom Retro Styles -->
  <link rel="stylesheet" href="css/retro.css">
  
  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'crt-black': '#0a0a0a',
            'crt-dark': '#1a1a2e',
            'neon-green': '#00ff41',
            'neon-cyan': '#00d4ff',
            'neon-magenta': '#ff00ff',
            'win95-blue': '#000080',
            'win95-gray': '#808080',
            'win95-yellow': '#ffcc00',
          },
          fontFamily: {
            'pixel': ['VT323', 'monospace'],
          },
        },
      },
    }
  </script>
</head>
<body class="bg-crt-black font-pixel text-neon-green min-h-screen">
  
  <!-- CRT Overlay Effects -->
  <div class="crt-overlay"></div>
  <div class="vignette"></div>
  
  <!-- Test Window -->
  <div class="win95-window max-w-md mx-auto mt-20">
    <div class="win95-titlebar">
      <span class="win95-titlebar-text">test.exe</span>
      <div class="win95-titlebar-buttons">
        <button class="win95-btn">─</button>
        <button class="win95-btn">□</button>
        <button class="win95-btn">×</button>
      </div>
    </div>
    <div class="win95-content">
      <p class="text-lg">Windows 95 style working!</p>
      <button class="win95-action-btn mt-4">Click Me</button>
    </div>
  </div>
  
</body>
</html>
